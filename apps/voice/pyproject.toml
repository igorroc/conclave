[project]
name = "conclave-voice"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kokoro-onnx==0.6.1",
    "soundfile>=0.13,<0.14",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "psutil>=7,<8",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
    "playwright>=1.64.1",
    "lupa>=2.6,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
